# ResilientSC dataset registry — Phase 2
#
# Every entry below was actually downloaded and inspected in this environment
# (see the row/column counts, missing-value counts, and quality notes — none of
# these numbers are estimates). Entries with status NOT_ACQUIRED were
# deliberately not downloaded, with the reason stated, per the Phase 1 rule
# against fabricating dataset statistics. Raw files live under data/raw/<name>/
# (gitignored — see .gitignore — this file is the durable record).

datasets:

  - name: demand_uci_online_retail
    status: ACQUIRED
    category: "A. Demand forecasting"
    source: "UCI Machine Learning Repository"
    url: "https://archive.ics.uci.edu/dataset/352/online+retail"
    download_url: "https://archive.ics.uci.edu/ml/machine-learning-databases/00352/Online%20Retail.xlsx"
    license: "CC BY 4.0 (per UCI ML Repository dataset page) — verify on the page before external redistribution"
    file_format: xlsx
    local_path: "data/raw/demand_uci_online_retail/Online_Retail.xlsx"
    rows: 541909
    columns: 8
    column_names: [InvoiceNo, StockCode, Description, Quantity, InvoiceDate, UnitPrice, CustomerID, Country]
    date_range: "2010-12-01 to 2011-12-09"
    unique_products: 4070
    unique_countries: 38
    missing_values:
      Description: 1454
      CustomerID: 135080
      other_columns: 0
    data_quality_issues:
      - "10,624 rows have negative Quantity — these are returns/cancelled orders (InvoiceNo starts with 'C'), not real demand; must be split out, not summed into demand_quantity as-is"
      - "135,080 rows have no CustomerID — usable for product-level daily demand aggregation regardless, since DEMAND schema doesn't need customer identity"
      - "Transaction-level, not pre-aggregated — needs groupby(date, StockCode, Country) to reach the internal DEMAND grain (date, product_id, location_id, demand_quantity)"
    internal_schema_mapping:
      DEMAND.date: "InvoiceDate (truncated to day for aggregation)"
      DEMAND.product_id: StockCode
      DEMAND.location_id: Country
      DEMAND.demand_quantity: "sum(Quantity) after excluding cancelled-order rows"
    intended_use: "Baseline + XGBoost demand forecasting training/eval data (model-plan.md)"
    redistribution: "Permitted for hackathon use under CC BY 4.0 with attribution to UCI ML Repository / the original contributing organization"

  - name: ports_world_port_index
    status: ACQUIRED
    category: "E. Ports / routes"
    source: "US National Geospatial-Intelligence Agency (NGA), mirrored via Humanitarian Data Exchange (HDX)"
    url: "https://data.humdata.org/dataset/world-port-index"
    download_url: "https://data.humdata.org/dataset/3f976f27-2566-4ea7-b29e-7fc6ebc90aab/resource/060abaf3-8c9f-4df4-b7e3-5335a15c6247/download/world_port_index.zip"
    license: "Public domain (US government work)"
    file_format: "Esri Shapefile (.dbf attribute table + .shp/.shx/.prj geometry)"
    local_path: "data/raw/ports_world_port_index/WPI.*"
    rows: 3669
    columns: 78
    date_note: "HDX mirror last modified 2017-03-28 — the official NGA source (msi.nga.mil/Publications/WPI) is republished monthly; this snapshot is stale for any port whose infrastructure changed post-2017. Re-pull from the official source before relying on this for anything beyond hackathon-demo port coordinates/characteristics."
    key_columns: [INDEX_NO, PORT_NAME, COUNTRY, LATITUDE, LONGITUDE, HARBORSIZE, HARBORTYPE, CHAN_DEPTH, CARGODEPTH, MAX_VESSEL, CRANEFIXED, CRANEMOBIL]
    missing_values: "Most of the 78 facility/service flag columns are sparse (blank = 'not reported', not necessarily 'absent') — expected for this dataset, not a defect; only PORT_NAME/COUNTRY/LATITUDE/LONGITUDE/HARBORSIZE/HARBORTYPE are reliably populated across all 3,669 rows"
    data_quality_issues:
      - "reading requires a .dbf-capable reader (dbfread) — pandas.read_csv does not apply; geopandas would be the production-grade reader if the .shp geometry is needed beyond lat/lon"
      - "2017 vintage — flagged above; acceptable for hackathon port master data, not for a production deployment without a refresh"
    internal_schema_mapping:
      ROUTES.origin / ROUTES.destination: "PORT_NAME (joined via INDEX_NO) — this is port MASTER data, not origin-destination pairs; route pairs and distances still need CERDI-Searoute or a manually curated set (see Phase 2 notes below)"
    intended_use: "Port identity/location/characteristics master data feeding ROUTES and the Logistics Network map"
    redistribution: "Public domain; safe to redistribute"

  - name: tariffs_worldbank_wdi
    status: ACQUIRED
    category: "G. Tariffs / trade"
    source: "World Bank World Development Indicators — Tariff rate, applied, weighted mean, all products (%)"
    url: "https://data.worldbank.org/indicator/TM.TAX.MRCH.WM.AR.ZS"
    download_url: "https://api.worldbank.org/v2/en/indicator/TM.TAX.MRCH.WM.AR.ZS?downloadformat=csv"
    license: "CC BY-4.0"
    file_format: csv
    local_path: "data/raw/tariffs_worldbank_wdi/API_TM.TAX.MRCH.WM.AR.ZS_DS2_en_csv_v2_35363.csv"
    rows: 265
    columns: 70
    year_range: "1960-2025 (one column per year; 2025 present but empty)"
    missing_values:
      "2020": "40.4% of countries missing"
      "2021": "40.0% of countries missing"
      "2022": "45.7% of countries missing"
      "2023": "100% missing (not yet published)"
    data_quality_issues:
      - "country-year grain, NOT country-pair × product like the brief's TARIFFS schema wants (origin_country, destination_country, product_id/category) — this is a real, honest gap: WITS/TRAINS bulk (SDMX) has the granular version but needs a documented reporter/partner/product code lookup that wasn't completed in this pass. Recorded as a Phase 3 follow-up, not silently worked around."
      - "265 rows includes regional aggregates (e.g. 'World', 'European Union') alongside individual countries — must filter by Metadata_Country's Region field to isolate actual countries before use"
      - "most recent usable year is 2022 for most countries; 2023+ is not yet populated by World Bank"
    internal_schema_mapping:
      TARIFFS.origin_country: "not directly available at this grain — see gap above"
      TARIFFS.tariff_rate: "applied_weighted_mean by (country, year), used as a country-level proxy until WITS/TRAINS granular data is pulled"
    intended_use: "Tariff Increase scenario realism + optimization engine's tariff-cost term (country-level proxy for the MVP)"
    redistribution: "Permitted under CC BY-4.0 with attribution to the World Bank"

  - name: weather_noaa_storm_events
    status: ACQUIRED
    category: "H. Weather"
    source: "NOAA National Centers for Environmental Information — Storm Events Database"
    url: "https://www.ncei.noaa.gov/stormevents/"
    download_url: "https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/StormEvents_details-ftp_v1.0_d2024_c20260728.csv.gz"
    license: "Public domain (US government work)"
    file_format: csv
    local_path: "data/raw/weather_noaa_storm_events/StormEvents_details_2024.csv"
    rows: 69801
    columns: 51
    date_range: "2024-01 to 2024-12"
    states_covered: 68
    top_event_types: {Thunderstorm Wind: 19940, Hail: 8941, Flash Flood: 4661, High Wind: 3994, Winter Weather: 3557}
    missing_values:
      CATEGORY: 69725
      "TOR_* columns": "~67,450-69,450 (expected — only populated for tornado events)"
      MAGNITUDE: 33334
      note: "high missingness on event-type-specific columns is structural (a Hail row has no TOR_F_SCALE), not a data quality defect"
    data_quality_issues:
      - "US-only coverage — fine for grounding the Severe Weather scenario's shape (real event types, durations, damage fields), not usable as-is for the platform's Asia/Europe/Suez-corridor narrative; treat as a structural/statistical reference, not a literal source of in-scenario events"
    internal_schema_mapping:
      DISRUPTIONS.event_type: "EVENT_TYPE (real category vocabulary for the Sensing Agent's structured-event schema)"
      DISRUPTIONS.severity: "derivable from MAGNITUDE / DAMAGE_PROPERTY / DAMAGE_CROPS"
      DISRUPTIONS.start_date/end_date: "BEGIN_DATE_TIME / END_DATE_TIME"
    intended_use: "Grounds the Severe Weather disruption scenario's event shape and severity distribution; not the source of the literal demo events"
    redistribution: "Public domain; safe to redistribute"

  - name: supplier_master_data
    status: NOT_ACQUIRED
    category: "B. Supplier information"
    reason: >
      No public dataset carries supplier capacity, lead time, unit cost, or
      reliability — these are commercially sensitive and not published by
      any source I could find. Open Supply Hub (opensupplyhub.org) has real
      facility identity/location data but its API returned 401 Unauthorized
      for every unauthenticated request tested — it requires a registered API
      token, which this environment doesn't have. Per data-plan.md, supplier
      capacity/cost/lead-time fields will be synthesized on top of either
      Open Supply Hub identities (if a token becomes available) or plausible
      manually-curated supplier names, with the synthesis method documented
      in the Phase 3 preprocessing code — not left implicit.
    attempted_sources:
      - {name: "Open Supply Hub API", url: "https://opensupplyhub.org/api/facilities/", result: "401 Unauthorized — needs API token"}

  - name: inventory_snapshots
    status: NOT_ACQUIRED
    category: "C. Inventory"
    reason: >
      Confirmed in Phase 1 (data-plan.md) and unchanged after Phase 2 search —
      warehouse-level opening/closing stock ledgers are internal ERP data that
      isn't published anywhere public. Will be derived from
      demand_uci_online_retail + a synthetic starting-stock assumption during
      Phase 3 preprocessing, labeled as derived/simulated everywhere it
      surfaces in the UI.

  - name: shipment_records
    status: NOT_ACQUIRED
    category: "D. Transportation / logistics"
    reason: >
      The strongest real candidate (Kaggle's "DataCo Smart Supply Chain
      Dataset") requires a Kaggle account + API token, which this environment
      doesn't have — acquiring it needs a human to either (a) run
      `kaggle datasets download -d shashwatwork/dataco-smart-supply-chain-for-big-data-analysis`
      with their own Kaggle credentials, or (b) manually download it from
      kaggle.com and drop it in data/raw/. Two non-Kaggle alternatives were
      tested and rejected: FHWA's Freight Analysis Framework (FAF5) is real
      and downloadable (140MB, state-to-state commodity flow) but is
      aggregate freight-flow data, not individual shipment records, so it
      doesn't fit the SHIPMENTS schema's grain; BTS's Port Performance
      Freight Statistics Program blocked automated access (403, bot
      protection). Shipment-level data for the demo will use World Port
      Index locations (acquired above) with route distances/costs computed
      from the CERDI-Searoute methodology once that dataset's access terms
      are confirmed, or a small manually-constructed shipment set if that
      also falls through — decided in Phase 3, not guessed here.
    attempted_sources:
      - {name: "FHWA Freight Analysis Framework (FAF5) State", url: "https://faf.ornl.gov/faf5/data/download_files/FAF5.6.1_State.zip", result: "200 OK, 140MB — real but wrong grain (state-to-state aggregate, not shipment-level)"}
      - {name: "BTS Port Performance Freight Statistics Program", url: "https://www.bts.gov/ports-performance", result: "403 Forbidden (Akamai bot protection)"}

  - name: disruption_event_log
    status: PARTIAL
    category: "F. Disruptions / events"
    reason: >
      As flagged in Phase 1: real disruption events are inherently sparse
      (a handful of real occurrences per scenario type, not a big dataset).
      weather_noaa_storm_events (acquired above) grounds the Severe Weather
      scenario's statistical shape. The other five scenario types
      (Suez Canal Closure, Major Supplier Failure, Tariff Increase, Port
      Congestion, Demand Surge) will be a small manually curated event log
      built from public historical record (e.g. the 2021 Ever Given/Suez
      closure's real dates and duration) — this is Phase 3 work, not
      fabricated here.

  - name: ntm_prevalence_sector_unctad
    status: ACQUIRED
    category: "G. Tariffs / trade"
    source: "Structure matches the UNCTAD/World Bank Non-Tariff Measures (NTM) database's prevalence-by-sector export (the WITS/TRAINS NTM data family). Provided directly, not downloaded from a logged URL in this environment, so the exact publisher URL and vintage are NOT independently verified here — verify before citing externally."
    url: "not verified in this workspace"
    download_url: "not verified in this workspace"
    license: "not verified in this workspace — UNCTAD/WITS NTM data is typically open, but confirm before redistribution"
    file_format: csv
    local_path: "data/raw/ntm_prevalence_sector_unctad/NTM-Prevalence-Sector.csv"
    rows: 3943
    columns: 5
    column_names: ["ReporterIS03 (sic — header has a digit '0', not the letter 'O', and a UTF-8 BOM on the first cell; read with encoding='utf-8-sig')", "Sector", "NTM Type Count", "Share %", "NTM affected product - count"]
    reporters: 75
    sectors: 16
    sector_values: ["All Import Products", "Animal", "Chemicals", "Food Products", "Footwear", "Fuels", "Hides and Skins", "Mach and Elec", "Metals", "Minerals", "Miscellaneous", "Plastic or Rubber", "Stone and Glass", "Textiles and Clothing", "Transportation", "Vegetable", "Wood"]
    ntm_type_count_buckets: [" No NTMs (sic — leading space in the raw value)", "1 type", "2 types", "3+ types"]
    missing_values: "none observed across all 5 columns"
    data_quality_issues:
      - "grain is (reporter ISO3, sector, NTM-type-count bucket) -> share of that reporter-sector's products falling in that bucket, NOT a tariff rate; complements tariff.csv (applied tariff %) rather than extending it — the two must not be merged into one column"
      - "'NTM Type Count' is a categorical bucket string ('1 type', '2 types', '3+ types', ' No NTMs'), not a number; a numeric NTM-count feature would need bucket midpoints assumed, which has not been done here"
      - "'All Import Products' is a reporter-sector aggregate row mixed in alongside the 16 named sectors — must be filtered out (or kept separate) before treating the 15 named sectors as a partition"
    internal_schema_mapping: "No existing table in tables.py covers non-tariff measures; this is a new category, not a fit for TARIFF. Intended as a future ntm_prevalence_sector table (REAL) alongside tariff.csv, not yet built into data/cleaned (see docs/architecture.md follow-up)."
    intended_use: "Would enrich the Compliance/Sourcing agents' view of non-tariff trade friction per country/sector, alongside tariff.csv's applied-tariff-rate signal."
    redistribution: "Not verified in this workspace — confirm the source's license before external redistribution."

  - name: supply_chain_pressure_dwell_index
    status: ACQUIRED
    category: "I. Macro / supply-chain-pressure indicators (new category)"
    source: "Column names strongly match well-known published series — NY Fed Global Supply Chain Pressure Index ('gscpi'), BLS/FRED CPI-U all-items/goods/services ('cpi_us'/'cpi_goods'/'cpi_services'), Federal Reserve G.17 Industrial Production Index ('indpro'), a crude oil price series ('oil_price'), and Port of LA / Marine Exchange of Southern California vessel dwell time ('dwell_la_raw', 'la_unique_vessels'). Provided directly, not downloaded from a logged URL, so this attribution is inferred from column semantics and NOT independently re-verified against each publisher in this environment."
    url: "not verified in this workspace"
    download_url: "not verified in this workspace"
    license: "not verified in this workspace — the underlying series (BLS, Federal Reserve, NY Fed) are typically public-domain US government/central-bank data, but this specific compiled file's own license is unconfirmed"
    file_format: csv
    local_path: "data/raw/supply_chain_pressure_dwell_index/analysis_dataset_dwell.csv"
    rows: 297
    columns: 16
    column_names: [date, cpi_us, cpi_goods, cpi_services, indpro, oil_price, gscpi, cpi_yoy, cpi_goods_yoy, cpi_services_yoy, indpro_yoy, oil_yoy, dwell_composite, dwell_la_raw, la_unique_vessels, dwell_la_detrended]
    date_range: "2001-01-01 to 2025-09-01, monthly"
    missing_values:
      "dwell_composite, dwell_la_raw, la_unique_vessels, dwell_la_detrended": "blank from 2001-01 through 2008-12 (96 rows), populated from 2009-01 onward — Port-of-LA vessel-dwell tracking in this file evidently starts in 2009, not 2001; the macro columns (cpi_*, indpro, oil_price, gscpi) are populated for the full 2001-2025 range"
    data_quality_issues:
      - "two duplicate copies of this file were provided ('analysis_dataset_dwell.csv' and 'analysis_dataset_dwell (1).csv'); byte-for-byte identical (diff confirmed) — only one copy was kept"
      - "monthly grain; the existing demand.csv/demand_modeling_panel.csv are daily (2010-12 to 2011-12) — any join to the demand panel would be many-to-one by month, not a like-for-like merge"
      - "gscpi (Global Supply Chain Pressure Index) is the one column most directly on-theme for a supply-chain resilience platform; it was NOT added as a model feature in this pass (scope was 'retrain on the corrected panel', not 'add new features') — noted here as a concrete follow-up"
    internal_schema_mapping: "No existing table in tables.py covers macro/pressure indices; this is a new category. Intended as a future supply_chain_pressure_index table (REAL/DERIVED) — not yet built into data/cleaned."
    intended_use: "Candidate exogenous signal for the Sensing agent's disruption context and, later, as an XGBoost demand-model feature (joined by month) — flagged for a future pass, not done in this one."
    redistribution: "Not verified in this workspace — confirm each underlying series' license before external redistribution."

  - name: weather_noaa_storm_events_1950
    status: PARTIAL
    category: "H. Weather"
    source: "NOAA National Centers for Environmental Information — Storm Events Database (same source family as weather_noaa_storm_events, which holds 2024)"
    url: "https://www.ncei.noaa.gov/stormevents/"
    download_url: "not logged in this workspace — provided directly"
    license: "Public domain (US government work), consistent with the existing weather_noaa_storm_events entry"
    file_format: csv
    local_path: "data/raw/weather_noaa_storm_events_1950/StormEvents_details-ftp_v1.0_d1950_c20260323.csv"
    rows: 223
    columns: 51
    date_range: "1950-01 to 1950-12 (tornado-only reporting era — NOAA's storm-event tracking in 1950 covered far fewer event types than 2024)"
    data_quality_issues:
      - "covers a single year, 1950, 74 years before the existing weather_noaa_storm_events table's year (2024) — the two do NOT form a continuous time series; merging them into one table would misleadingly imply continuous multi-decade coverage that does not exist"
      - "NOT merged into weather_event_noaa.csv in data/cleaned for this reason — kept as a separate acquisition, documented but not built into a cleaned table in this pass"
    intended_use: "A single additional historical reference point if a future pass wants multi-decade NOAA coverage; would need the intervening years acquired too before it adds real time-series value."
    redistribution: "Public domain; safe to redistribute."

  - name: emergency_situation_synthetic_kaggle
    status: ACQUIRED
    category: "F. Disruptions / events (synthetic) + E. Ports/routes (synthetic) + macro (synthetic)"
    source: "A 9-file extract from a larger multi-topic Kaggle sample-data bundle (the accompanying national_ais_release_manifest-style audit files reference sibling tables in the same bundle — Train, supply_chain_dataset1, c2k_data_comma, mnist_train_small, california_housing_test/train, mnist_test — confirming this is a generic practice/sample-datasets collection, not a dedicated real-world supply-chain research dataset)."
    url: "not verified in this workspace"
    file_format: csv (zipped as 'EMERGENCY_SITUATION DATASET.zip')
    local_path: "data/raw/emergency_situation_synthetic_kaggle/*.csv"
    provenance_finding: >
      GEOPOLITICAL_EVENTS.csv, ROUTE_INTEGRATED.csv, COMMODITY_MARKET.csv and COUNTRY_METADATA.csv are SYNTHETIC, not
      real historical/observed data — verified three independent ways, not assumed: (1) date coverage runs from
      2015-01-01 to 2026-12-31, i.e. into the future relative to today (2026-09-29); no real dataset has 2026-12-31
      history already recorded. (2) COMMODITY_MARKET.csv's oil_price shows no crash during the real March-April 2020
      COVID oil-price collapse (stays in the $38-47 range; WTI briefly went negative in reality). (3) COUNTRY_METADATA.csv
      lists the United States as income_group 'Low income' with population 250,467,210 and India as 'High income' with
      population 430,389,014 — both real countries' real attributes are scrambled/randomized, not measured.
      GEOPOLITICAL_EVENTS.csv's 10,000 base rows (E000001-E010000) are near-uniformly distributed across 9 event-type
      categories (~1,000 each) — a synthetic-generator signature — but it also contains 3 hand-labeled rows (MAJOR001
      'COVID Supply Shock' 2020-03-15, MAJOR002 'Russia Ukraine War' 2022-02-24, MAJOR003 'Red Sea Crisis' 2024-01-01)
      whose names and dates DO match real events; their numeric fields (duration_days, risk_increase) are still not
      sourced/measured, so even these 3 rows are provenance SYNTHETIC as a whole row, with only the name/date being
      real-world-anchored — documented per-row in geopolitical_event_synthetic's build, not silently treated as REAL.
    tables:
      - {file: GEOPOLITICAL_EVENTS.csv, rows: 10003, columns: 7, column_names: [event_id, date, event_type, severity, affected_region, duration_days, risk_increase], missing_values: "0 (per the bundle's own COLUMN_NULL_COUNTS.csv audit)"}
      - {file: ROUTE_INTEGRATED.csv, rows: 31300, columns: 20, column_names: [date, route_id, trade_volume_tonnes, shipping_delay_days, freight_cost_usd, container_availability_index, port_congestion_index, fuel_cost_index, commodity_price_index, weather_disruption_score, geopolitical_risk_score, route_status, carbon_emissions_tonnes, origin_country, destination_country, distance_km, shipping_method, trade_route_type, estimated_transit_days, Route_Risk_Score], missing_values: "0", note: "a pre-joined/denormalized table (per the manifest, merges the bundle's own weekly_route_operations + trade_routes + commodity_market + geopolitical_events sub-tables)"}
      - {file: COMMODITY_MARKET.csv, rows: 626, columns: 7, column_names: [date, oil_price, natural_gas_price, steel_price, wheat_price, copper_price, commodity_stress_index], missing_values: "0", date_range: "2015-01-04 to 2026-12-27, weekly"}
      - {file: COUNTRY_METADATA.csv, rows: 10, columns: 9, column_names: [country, iso3, region, income_group, population, gdp_per_capita, trade_dependency_score, port_capacity_index, logistics_performance_index], missing_values: "0", note: "iso3 codes correctly identify 10 real countries; every other attribute value is synthetic/randomized (see provenance_finding) — do NOT treat as real country facts, and do NOT merge into country.csv"}
      - {file: DAILY_DEMAND.csv, rows: 60, columns: 13, status: "REAL, not synthetic — this is the UCI 'Daily Demand Forecasting Orders' dataset (a Brazilian logistics company, order-category counts by week/day), confirmed by exact column match and by the sibling bundle's own manifest naming it 'Daily_Demand_Forecasting_Orders'", data_quality_issues: ["stored semicolon-delimited inside a .csv with a malformed multi-field header and trailing empty comma columns — needs a real parse (sep=';'), not pandas.read_csv defaults", "grain is (week-of-month, day-of-week) order-category counts for one unnamed company — no product_id or location_id, so it does NOT fit DEMAND's (date, product_id, location_id) grain and was not merged into demand.csv"], intended_use: "Acquired and documented; not integrated into any cleaned table this pass due to the grain mismatch (parallels the registry's existing NOT_ACQUIRED-style honesty about gaps, applied here to an acquired-but-not-yet-integrated file)."}
      - {file: "NULL_SUMMARY.csv, DUPLICATE_REPORT.csv, COLUMN_NULL_COUNTS.csv, ROW_NULL_COUNTS.csv", note: "the bundle's own internal QA/audit output about ALL of its tables (including ones outside this extract, like mnist_train_small) — kept alongside as provenance evidence for the null/duplicate counts cited above, not themselves a data source to build a cleaned table from"}
    internal_schema_mapping: "Built into data/cleaned as 4 new, clearly-labeled SYNTHETIC tables (geopolitical_event_synthetic, trade_route_synthetic, commodity_market_synthetic, country_metadata_synthetic) — see backend/services/preprocessing/cleaned/emergency_synthetic.py. Never merged into or presented alongside the REAL disruption_event/route/country tables; usable for Sensing-agent stress-testing volume, same role as the project's own scenario*.csv synthetic tables."
    intended_use: "Stress-test / demo volume for scenario simulation — NOT a source of real disruption or trade history."
    redistribution: "Not verified in this workspace."

  - name: national_ais_release
    status: NOT_ACQUIRED
    category: "D. Transportation / logistics"
    reason: >
      Only a manifest (national_ais_release_manifest.csv: filename, byte size, sha256 per file) was provided, listing
      18 files of a national AIS (vessel-tracking) data release — the actual data files (national_port_ais_2015.zip
      through national_port_ais_2025.zip, 300-500MB each per the manifest's own byte counts, plus a 12.4MB
      code_and_protocols.zip, vessel_characteristics.csv, and a port_areas_usace.geojson) are NOT present in this
      workspace. Per the Phase 1 rule against fabricating dataset statistics, nothing about their contents is asserted
      here beyond what the manifest itself states (names, sizes, hashes) — those files would need to be downloaded
      before any AIS-derived table could be built and honestly described.
    local_path: "data/raw/national_ais_release/national_ais_release_manifest.csv (manifest only)"
    attempted_sources:
      - {name: "the 18 files the manifest names", result: "not present in this workspace; only their manifest (names/sizes/hashes) was provided"}

