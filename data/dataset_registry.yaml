# Phase 3 summary (datasets dropped into ResilientSC-optimized/ and relocated here)
# Acquired, REAL, built into data/cleaned (2): none yet built as of this entry for
#   ntm_prevalence_sector_unctad / supply_chain_pressure_dwell_index — both ACQUIRED
#   and inspected, but registered as a new category with no existing tables.py slot;
#   see backend/services/preprocessing/cleaned/trade_measures.py and macro.py for the
#   modules that DO build them into data/cleaned as ntm_prevalence_sector and
